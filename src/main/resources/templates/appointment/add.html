<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Thêm lịch hẹn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="d-flex flex-column min-vh-100">


<!-- Menu -->
<div th:replace="~{layout/sidebar}"></div>



<!-- Nội dung -->
<div class="container mt-4 flex-grow-1">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Thêm lịch hẹn
                    </h4>

                </div>

                <div class="card-body">

                    <!-- Hiển thị lỗi -->
                    <div th:if="${error}" class="alert alert-danger">

                        <span th:text="${error}"></span>

                    </div>


                    <form th:action="@{/appointment/save}"
                          th:object="${appointment}"
                          method="post">


                        <!-- Mã lịch hẹn -->
                        <div class="mb-3">

                            <label class="form-label">
                                Mã lịch hẹn <span class="text-danger">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    LH-
                                </span>

                                <input type="text"
                                       th:field="*{appointmentCode}"
                                       class="form-control"
                                       placeholder="001"
                                       required>

                            </div>

                            <small class="text-muted">

                                Chỉ nhập phần số, ví dụ: 001

                            </small>

                        </div>



                        <!-- Bệnh nhân -->
                        <div class="mb-3">

                            <label class="form-label">
                                Bệnh nhân <span class="text-danger">*</span>
                            </label>

                            <select name="patientId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    -- Chọn bệnh nhân --
                                </option>

                                <option
                                        th:each="p : ${patients}"
                                        th:value="${p.id}"
                                        th:text="${p.fullName}"
                                        th:selected="${appointment.patient != null and appointment.patient.id == p.id}">
                                </option>

                            </select>

                        </div>



                        <!-- Ngày hẹn -->
                        <div class="mb-3">

                            <label class="form-label">
                                Ngày hẹn <span class="text-danger">*</span>
                            </label>

                            <input type="date"
                                   th:field="*{appointmentDate}"
                                   class="form-control"
                                   min="2026-01-01"
                                   required>

                        </div>



                        <!-- Giờ hẹn -->
                        <div class="mb-3">

                            <label class="form-label">
                                Giờ hẹn <span class="text-danger">*</span>
                            </label>

                            <input type="time"
                                   th:field="*{appointmentTime}"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- Trạng thái -->
                        <div class="mb-3">

                            <label class="form-label">
                                Trạng thái
                            </label>

                            <select th:field="*{status}"
                                    class="form-select">

                                <option value="Chờ khám">
                                    Chờ khám
                                </option>

                                <option value="Đã check-in">
                                    Đã check-in
                                </option>

                                <option value="Đang khám">
                                    Đang khám
                                </option>

                                <option value="Hoàn thành">
                                    Hoàn thành
                                </option>

                            </select>

                        </div>



                        <!-- Ghi chú -->
                        <div class="mb-3">

                            <label class="form-label">
                                Ghi chú
                            </label>

                            <textarea
                                    th:field="*{note}"
                                    class="form-control"
                                    rows="3">
                            </textarea>

                        </div>



                        <button class="btn btn-success">

                            Lưu

                        </button>

                        <a href="/appointment"
                           class="btn btn-secondary">

                            Quay lại

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- Footer -->
<div class="mt-auto"
     th:replace="~{layout/footer}">
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
