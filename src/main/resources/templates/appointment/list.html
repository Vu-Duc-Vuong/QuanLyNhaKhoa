<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Danh sách lịch hẹn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body class="d-flex flex-column min-vh-100 bg-light">


<!-- Navbar -->
<div th:replace="~{layout/sidebar}"></div>



<!-- Nội dung -->
<div class="container mt-4 flex-grow-1">


    <div class="card shadow-sm border-0 content-card p-4">



      <h2 class="text-primary fw-bold mb-4">
    Danh sách lịch hẹn
</h2>


<!-- Thêm lịch hẹn -->

<div class="mb-3">

    <a th:href="@{/appointment/add}"
       class="btn btn-primary d-inline-block">

        + Thêm lịch hẹn

    </a>

</div>




<!-- Tìm kiếm -->

<form th:action="@{/appointment/search}"
      method="get"
      class="d-flex mb-3">


    <input type="text"
           name="keyword"
           th:value="${keyword}"
           class="form-control me-2"
           placeholder="Nhập mã lịch hoặc tên bệnh nhân">



    <button class="btn btn-success">

        Tìm kiếm

    </button>


</form>



        <!-- Thông báo -->

        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">

            <span th:text="${success}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>




        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">

            <span th:text="${error}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>







        <!-- Bảng lịch hẹn -->

        <div class="table-responsive">

            <table class="table table-bordered table-hover table-custom mb-0">


                <thead class="table-dark">

                <tr>

                    <th>Mã lịch</th>

                    <th>Bệnh nhân</th>

                    <th>Ngày</th>

                    <th>Giờ</th>

                    <th>Trạng thái</th>

                    <th>Chức năng</th>

                </tr>

                </thead>



                <tbody>


                <tr th:each="a : ${appointments}">


                    <td th:text="${a.appointmentCode}">
                        LH-001
                    </td>



                    <td th:text="${a.patient != null ? a.patient.fullName : 'Chưa có'}">
                        Nguyễn Văn A
                    </td>



                    <td th:text="${a.appointmentDate}">
                        2026-07-26
                    </td>



                    <td th:text="${a.appointmentTime}">
                        08:00
                    </td>




                    <td>


                        <span th:if="${a.status == 'Chờ khám'}"
                              class="badge bg-warning text-dark">

                            Chờ khám

                        </span>



                        <span th:if="${a.status == 'Đã check-in'}"
                              class="badge bg-info">

                            Đã check-in

                        </span>



                        <span th:if="${a.status == 'Đang khám'}"
                              class="badge bg-primary">

                            Đang khám

                        </span>



                        <span th:if="${a.status == 'Hoàn thành'}"
                              class="badge bg-success">

                            Hoàn thành

                        </span>


                    </td>






                    <td>


                        <!-- Sửa -->
                        <a th:href="@{/appointment/edit/{id}(id=${a.id})}"
                           class="btn btn-warning btn-sm me-1 mb-1">

                            Sửa

                        </a>





                        <!-- Check-in -->

                        <a th:if="${a.status == 'Chờ khám'}"
                           th:href="@{/appointment/status/{id}/{status}
                           (id=${a.id},status='Đã check-in')}"
                           class="btn btn-success btn-sm me-1 mb-1">

                            Check-in

                        </a>







                        <!-- Bắt đầu khám -->

                        <a th:if="${a.status == 'Đã check-in'}"
                           th:href="@{/appointment/status/{id}/{status}
                           (id=${a.id},status='Đang khám')}"
                           class="btn btn-primary btn-sm me-1 mb-1">

                            Bắt đầu khám

                        </a>







                        <!-- Hoàn thành -->

                        <a th:if="${a.status == 'Đang khám'}"
                           th:href="@{/appointment/status/{id}/{status}
                           (id=${a.id},status='Hoàn thành')}"
                           class="btn btn-success btn-sm me-1 mb-1">

                            Hoàn thành

                        </a>







                        <!-- Xóa -->

                        <a th:href="@{/appointment/delete/{id}(id=${a.id})}"
                           class="btn btn-danger btn-sm mb-1"
                           onclick="return confirm('Bạn có chắc muốn xóa lịch hẹn này?')">

                            Xóa

                        </a>


                    </td>



                </tr>







                <tr th:if="${#lists.isEmpty(appointments)}">


                    <td colspan="6"
                        class="text-center text-muted py-4">

                        Chưa có dữ liệu lịch hẹn

                    </td>


                </tr>



                </tbody>


            </table>


        </div>



    </div>






    <!-- Footer -->

    <div class="mt-auto"
         th:replace="~{layout/footer}">
    </div>



</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
