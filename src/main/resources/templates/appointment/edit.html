<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Sửa lịch hẹn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body class="d-flex flex-column min-vh-100">


<!-- Sidebar -->
<div th:replace="~{layout/sidebar}"></div>



<!-- Nội dung -->
<div class="container mt-4 flex-grow-1">


    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card shadow">



                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Sửa lịch hẹn
                    </h4>

                </div>



                <div class="card-body">


                    <form th:action="@{/appointment/save}"
                          method="post">



                        <!-- ID -->
                        <input type="hidden"
                               name="id"
                               th:value="${appointment.id}">





                        <!-- Mã lịch hẹn -->

                        <div class="mb-3">


                            <label class="form-label">

                                Mã lịch hẹn

                            </label>



                            <div class="input-group">


                                <span class="input-group-text">
                                    LH-
                                </span>



                                <input type="text"
                                       class="form-control"
                                       name="appointmentCode"
                                       th:value="${appointment.appointmentCode}"
                                       readonly>


                            </div>


                        </div>







                        <!-- Bệnh nhân -->


                        <div class="mb-3">


                            <label class="form-label">

                                Bệnh nhân
                                <span class="text-danger">*</span>

                            </label>



                            <select name="patientId"
                                    class="form-select"
                                    required>


                                <option value="">
                                    -- Chọn bệnh nhân --
                                </option>



                                <option th:each="p : ${patients}"
                                        th:value="${p.id}"
                                        th:text="${p.fullName}"
                                        th:selected="${appointment.patient != null and p.id == appointment.patient.id}">

                                </option>



                            </select>


                        </div>







                        <!-- Ngày hẹn -->


                        <div class="mb-3">


                            <label class="form-label">

                                Ngày hẹn
                                <span class="text-danger">*</span>

                            </label>



                            <input type="date"
                                   name="appointmentDate"
                                   class="form-control"
                                   th:value="${appointment.appointmentDate}"
                                   required>


                        </div>







                        <!-- Giờ hẹn -->


                        <div class="mb-3">


                            <label class="form-label">

                                Giờ hẹn
                                <span class="text-danger">*</span>

                            </label>



                            <input type="time"
                                   name="appointmentTime"
                                   class="form-control"
                                   th:value="${appointment.appointmentTime}"
                                   required>


                        </div>








                        <!-- Trạng thái -->


                        <div class="mb-3">


                            <label class="form-label">

                                Trạng thái

                            </label>



                            <select name="status"
                                    class="form-select">



                                <option value="Chờ khám"
                                        th:selected="${appointment.status == 'Chờ khám'}">

                                    Chờ khám

                                </option>



                                <option value="Đã check-in"
                                        th:selected="${appointment.status == 'Đã check-in'}">

                                    Đã check-in

                                </option>



                                <option value="Đang khám"
                                        th:selected="${appointment.status == 'Đang khám'}">

                                    Đang khám

                                </option>



                                <option value="Hoàn thành"
                                        th:selected="${appointment.status == 'Hoàn thành'}">

                                    Hoàn thành

                                </option>



                            </select>


                        </div>







                        <!-- Ghi chú -->


                        <div class="mb-3">


                            <label class="form-label">

                                Ghi chú

                            </label>



                            <textarea name="note"
                                      class="form-control"
                                      rows="3"
                                      th:text="${appointment.note}">
                            </textarea>


                        </div>








                        <button type="submit"
                                class="btn btn-success">

                            Lưu thay đổi

                        </button>




                        <a href="/appointment"
                           class="btn btn-secondary">

                            Quay lại

                        </a>



                    </form>



                </div>


            </div>


        </div>


    </div>


</div>





<!-- Footer -->

<div class="mt-auto"
     th:replace="~{layout/footer}">
</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
