<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mới thuốc - Quản lý Nha khoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #212529 !important; }
        .nav-link { font-weight: 500 !important; }
/* Đồng bộ 100% Navbar theo ảnh mẫu */
.navbar-dark .navbar-nav .nav-link {
    color: #ffffff !important;        /* Ép tất cả các chữ đều màu trắng sáng */
    font-weight: 400 !important;     /* Cố định độ dày nét chữ bằng nhau */
    opacity: 0.95;                    /* Rõ nét như hình mẫu */
    padding-left: 12px;
    padding-right: 12px;
}

/* Đảm bảo khi chọn (active) hoặc hover không bị thay đổi độ dày phông */
.navbar-dark .navbar-nav .nav-link.active,
.navbar-dark .navbar-nav .nav-link:hover {
    color: #ffffff !important;
    font-weight: 400 !important;
}
/* Ép khoảng cách mép trái/phải về chuẩn 20px giống hệt ảnh mẫu */
.navbar .container-fluid,
.container {
    padding-left: 12px !important;
    padding-right: 12px !important;
}
/* 1. Thu hẹp khoảng cách từ "Quản lý Nha khoa" sang "Trang chủ" */
.navbar-brand {
    margin-right: 24px !important; /* Đưa về chuẩn ~24px giống mẫu */
}

/* 2. Chỉnh khoảng cách giữa các chữ menu khít lại đúng như mẫu */
.navbar-dark .navbar-nav .nav-link {
    padding-left: 10px !important;  /* Khoảng cách trái/phải mỗi chữ */
    padding-right: 10px !important;
}
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid px-2">
            <a class="navbar-brand " href="#">Quản lý Nha khoa</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/patient">Bệnh nhân</a></li>
                    <li class="nav-item"><a class="nav-link" href="/appointment">Lịch hẹn</a></li>
                    <li class="nav-item"><a class="nav-link" href="/treatment">Khám bệnh</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/medicine">Thuốc</a></li>
                    <li class="nav-item"><a class="nav-link" href="/invoice">Hóa đơn</a></li>
                    <li class="nav-item"><a class="nav-link" href="/report">Báo cáo</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="me-3">admin</span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">Đăng xuất</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white fw-bold fs-5 py-3">
                Thêm mới thuốc
            </div>
            <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Lỗi!</strong>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                <form th:action="@{/medicine/save}" th:object="${medicine}" method="post">
                    
                    <div class="mb-3">
    <label class="form-label fw-bold">Mã thuốc <span class="text-danger">*</span></label>
    <!-- Tạo ô hiển thị sẵn chữ MED- ở đầu -->
    <div class="input-group">
        <span class="input-group-text fw-bold bg-light text-secondary">MED-</span>
        <input type="text" th:field="*{medicineCode}" class="form-control" placeholder="001" required>
    </div>
    <div class="form-text">Bạn chỉ cần nhập phần số (ví dụ: 001, 002).</div>
</div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên thuốc <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{medicineName}" class="form-control" placeholder="Nhập tên thuốc..." required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Đơn vị tính</label>
                            <input type="text" th:field="*{unit}" class="form-control" placeholder="Viên, Hộp, Vỉ...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Đơn giá (VNĐ)</label>
                            <input type="number" min="0" step="any" th:field="*{price}" class="form-control" placeholder="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Số lượng nhập</label>
                            <input type="number" th:field="*{quantity}" class="form-control" placeholder="0">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Ghi chú / Hướng dẫn</label>
                        <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Nhập ghi chú hoặc cách dùng..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/medicine}" class="btn btn-secondary px-4">Hủy</a>
                        <button type="submit" class="btn btn-primary px-4">Lưu thuốc</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
