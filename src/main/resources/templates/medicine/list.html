<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Danh sách thuốc</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>



<body class="d-flex flex-column min-vh-100 bg-light">



<!-- Navbar -->

<div th:replace="~{layout/sidebar}"></div>





<!-- Nội dung -->

<div class="container mt-4 flex-grow-1">



    <div class="card shadow-sm border-0 content-card p-4">





        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">



            <h2 class="text-primary fw-bold mb-0">

                Danh sách thuốc

            </h2>





            <div class="d-flex align-items-center gap-2">



                <!-- Tìm kiếm -->

                <form th:action="@{/medicine/search}"
                      method="get"
                      class="d-flex gap-2">



                    <input type="text"
                           name="keyword"
                           th:value="${keyword}"
                           class="form-control"
                           style="width:300px;"
                           placeholder="Nhập mã thuốc hoặc tên thuốc">





                    <button class="btn btn-success">

                        Tìm kiếm

                    </button>



                </form>





                <!-- Thêm thuốc -->

                <a th:href="@{/medicine/add}"
                   class="btn btn-primary">

                    + Thêm thuốc

                </a>



            </div>



        </div>








        <!-- Bảng danh sách -->

        <div class="table-responsive">



            <table class="table table-bordered table-hover table-custom mb-0">



                <thead class="table-dark">


                <tr>


                    <th>Mã thuốc</th>


                    <th>Tên thuốc</th>


                    <th>Đơn vị</th>


                    <th>Đơn giá</th>


                    <th>Số lượng</th>


                    <th>Ghi chú</th>


                    <th>Chức năng</th>


                </tr>


                </thead>






                <tbody>



                <tr th:each="med : ${medicines}">



                    <td th:text="${med.medicineCode}">
                        TH001
                    </td>




                    <td th:text="${med.medicineName}">
                        Paracetamol
                    </td>




                    <td th:text="${med.unit}">
                        Viên
                    </td>




                    <td th:text="${#numbers.formatDecimal(med.price,0,'COMMA',0,'POINT')} + ' đ'">
                        10.000 đ
                    </td>




                    <td th:text="${med.quantity}">
                        100
                    </td>




                    <td th:text="${med.note}">
                        Không có
                    </td>




                    <td>



                        <a th:href="@{/medicine/edit/{id}(id=${med.id})}"
                           class="btn btn-warning btn-sm me-1">

                            Sửa

                        </a>





                        <a th:href="@{/medicine/delete/{id}(id=${med.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa thuốc này?')">

                            Xóa

                        </a>



                    </td>



                </tr>







                <tr th:if="${#lists.isEmpty(medicines)}">


                    <td colspan="7"
                        class="text-center text-muted py-4">

                        Chưa có dữ liệu thuốc nào.

                    </td>


                </tr>





                </tbody>


            </table>



        </div>




    </div>



</div>







<!-- Footer -->

<div class="mt-auto"
     th:replace="~{layout/footer}">
</div>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>



</body>


</html>
