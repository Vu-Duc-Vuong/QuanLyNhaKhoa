<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Danh sách thuốc</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<div th:replace="~{layout/sidebar}"></div>

<!-- Nội dung -->
<div class="container mt-4 flex-grow-1">

    <h2 class="mb-4">
        Danh sách thuốc
    </h2>

    <!-- Nút thêm -->
    <a th:href="@{/medicine/add}"
       class="btn btn-primary mb-3">
        + Thêm thuốc
    </a>

    <!-- Tìm kiếm -->
    <form th:action="@{/medicine/search}"
          method="get"
          class="d-flex mb-3">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               class="form-control me-2"
               placeholder="Nhập mã thuốc hoặc tên thuốc">

        <button class="btn btn-success">
            Tìm kiếm
        </button>

    </form>

    <!-- Danh sách -->
    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>Mã thuốc</th>

            <th>Tên thuốc</th>

            <th>Đơn vị</th>

            <th>Đơn giá</th>

            <th>Số lượng</th>

            <th>Ghi chú</th>

            <th>Chức năng</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="med : ${medicines}">

            <td th:text="${med.medicineCode}"></td>

            <td th:text="${med.medicineName}"></td>

            <td th:text="${med.unit}"></td>

            <td th:text="${#numbers.formatDecimal(med.price,0,'COMMA',0,'POINT')} + ' đ'"></td>

            <td th:text="${med.quantity}"></td>

            <td th:text="${med.note}"></td>

            <td>

                <a th:href="@{/medicine/edit/{id}(id=${med.id})}"
                   class="btn btn-warning btn-sm">
                    Sửa
                </a>

                <a th:href="@{/medicine/delete/{id}(id=${med.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa thuốc này?')">
                    Xóa
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(medicines)}">

            <td colspan="7"
                class="text-center text-muted">

                Chưa có dữ liệu thuốc nào.

            </td>

        </tr>

        </tbody>

    </table>

</div>

<!-- Footer -->
<div class="mt-auto"
     th:replace="~{layout/footer}">
</div>

</body>

</html>
