<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Thêm nha khoa</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>
Thêm nha khoa
</h2>


<form th:action="@{/clinic/save}"
      th:object="${clinic}"
      method="post">


<div class="mb-3">

<label>
Tên nha khoa <span class="text-danger">*</span>
</label>

<input type="text"
       th:field="*{clinicName}"
       class="form-control"
       required>

</div>



<div class="mb-3">

<label>
Địa chỉ
</label>

<input type="text"
       th:field="*{address}"
       class="form-control">

</div>



<div class="mb-3">

<label>
Số điện thoại
</label>

<input type="text"
       th:field="*{phone}"
       class="form-control">

</div>



<div class="mb-3">

<label>
Email
</label>

<input type="email"
       th:field="*{email}"
       class="form-control">

</div>



<div class="mb-3">

<label>
Trạng thái
</label>

<select th:field="*{status}"
        class="form-select">

<option value="ACTIVE">
Hoạt động
</option>

<option value="INACTIVE">
Ngừng hoạt động
</option>

</select>

</div>



<button class="btn btn-success">
Lưu
</button>


<a href="/clinic"
class="btn btn-secondary">

Quay lại

</a>


</form>


</div>


</body>

</html>
