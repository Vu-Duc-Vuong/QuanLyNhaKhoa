<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách nha khoa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">


<div class="container mt-4">


    <h2 class="fw-bold mb-4">
        Danh sách nha khoa
    </h2>


    <a th:href="@{/clinic/add}"
       class="btn btn-primary mb-3">

        + Thêm nha khoa

    </a>


    <form th:action="@{/clinic/search}"
          method="get"
          class="mb-3">

        <div class="input-group">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control"
                   placeholder="Nhập tên nha khoa">

            <button class="btn btn-success">
                Tìm kiếm
            </button>

        </div>

    </form>


    <table class="table table-bordered table-hover bg-white">


        <thead class="table-dark">

        <tr>

            <th>STT</th>

            <th>Tên nha khoa</th>

            <th>Địa chỉ</th>

            <th>Số điện thoại</th>

            <th>Email</th>

            <th>Trạng thái</th>

            <th>Chức năng</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="c, i : ${clinics}">


            <td th:text="${i.index + 1}"></td>


            <td th:text="${c.clinicName}"
                class="fw-bold"></td>


            <td th:text="${c.address}"></td>


            <td th:text="${c.phone}"></td>


            <td th:text="${c.email}"></td>


            <td>

                <span class="badge bg-success"
                      th:text="${c.status}">
                </span>

            </td>


            <td>

                <a th:href="@{/clinic/edit/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>


                <a th:href="@{/clinic/delete/{id}(id=${c.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xóa nha khoa này?')">

                    Xóa

                </a>


            </td>


        </tr>


        <tr th:if="${#lists.isEmpty(clinics)}">

            <td colspan="7"
                class="text-center text-muted">

                Chưa có dữ liệu nha khoa

            </td>

        </tr>


        </tbody>


    </table>


</div>


</body>
</html>
