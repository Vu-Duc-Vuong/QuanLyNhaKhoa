<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Doanh Thu - Nha Khoa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h3 class="mb-4 fw-bold text-primary">BÁO CÁO DOANH THU & HÓA ĐƠN</h3>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-success text-white p-3 shadow-sm">
                    <h5>Tổng Doanh Thu</h5>
                    <h3 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</h3>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">Danh Sách Hóa Đơn Đã Thanh Toán</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã Hóa Đơn</th>
                            <th>Ngày Lập</th>
                            <th>Bệnh Nhân</th>
                            <th>Số Tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inv : ${invoiceList}">
                            <td th:text="${'INV-' + inv.id}">INV-1001</td>
                            <td th:text="${inv.createdDate}">24/07/2026</td>
                            <td th:text="${inv.patientName}">Nguyễn Văn A</td>
                            <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(inv.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>
                        </tr>
                        <tr th:if="${invoiceList == null or #lists.isEmpty(invoiceList)}">
                            <td colspan="4" class="text-center text-muted py-3">Chưa có dữ liệu hóa đơn</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
