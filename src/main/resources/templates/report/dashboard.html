<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Báo Cáo Doanh Thu - Quản Lý Nha Khoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .table-primary-custom th { background-color: #0d6efd !important; color: #ffffff !important; }
        .card-stat { border-radius: 6px; }
        .text-nowrap-custom { white-space: nowrap !important; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{layout/sidebar}"></div>

    <div class="container-fluid px-4 mt-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark m-0">Báo cáo doanh thu</h2>
            
            <form method="get" action="/report" class="d-flex align-items-center gap-2">
                <label class="fw-bold me-1">Chọn Tháng:</label>
                <select name="month" class="form-select form-select-sm" style="width: 110px;">
                    <option th:each="m : ${#numbers.sequence(1, 12)}" 
                            th:value="${m}" 
                            th:text="'Tháng ' + ${m}" 
                            th:selected="${m == selectedMonth}"></option>
                </select>
                <select name="year" class="form-select form-select-sm" style="width: 100px;">
                    <option th:each="y : ${#numbers.sequence(2024, 2030)}" 
                            th:value="${y}" 
                            th:text="${y}" 
                            th:selected="${y == selectedYear}"></option>
                </select>
                <button type="submit" class="btn btn-primary btn-sm fw-bold">Xem</button>
                <button type="button" onclick="window.print()" class="btn btn-outline-secondary btn-sm ms-2">In báo cáo</button>
            </form>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card card-stat bg-primary text-white border-0 shadow-sm">
                    <div class="card-body">
                        <div class="text-white-50 small font-weight-bold text-uppercase mb-1">Tổng Doanh Thu</div>
                        <h3 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(totalRevenue != null ? totalRevenue : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card card-stat bg-primary text-white border-0 shadow-sm">
                    <div class="card-body">
                        <div class="text-white-50 small font-weight-bold text-uppercase mb-1">Doanh Thu Hôm Nay</div>
                        <h3 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(todayRevenue != null ? todayRevenue : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card card-stat bg-primary text-white border-0 shadow-sm">
                    <div class="card-body">
                        <div class="text-white-50 small font-weight-bold text-uppercase mb-1">Tổng Hóa Đơn</div>
                        <h3 class="fw-bold mb-0" th:text="${totalInvoices != null ? totalInvoices : 0}">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card card-stat bg-primary text-white border-0 shadow-sm">
                    <div class="card-body">
                        <div class="text-white-50 small font-weight-bold text-uppercase mb-1">Hóa Đơn Hôm Nay</div>
                        <h3 class="fw-bold mb-0" th:text="${todayInvoicesCount != null ? todayInvoicesCount : 0}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 content-card p-4 mb-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0 w-100">
                        <thead class="table-primary-custom">
                            <tr>
                                <th class="py-3 px-3 text-nowrap-custom" style="width: 100px;">Mã HĐ</th>
                                <th class="py-3 px-3 text-center text-nowrap-custom" style="width: 180px;">Ngày & Giờ Lập</th>
                                <th class="py-3 px-3 text-nowrap-custom" style="width: 90px;">Mã BN</th>
                                <th class="py-3 px-3 text-nowrap-custom" style="width: 180px;">Tên Bệnh Nhân</th>
                                <th class="py-3 px-3">Nội Dung / Dịch Vụ</th>
                                <th class="py-3 px-3 text-end text-nowrap-custom" style="width: 130px;">Số Tiền</th>
                                <th class="py-3 px-3 text-center text-nowrap-custom" style="width: 140px;">Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inv : ${invoiceList}">
                                <td class="px-3 fw-bold text-nowrap-custom" th:text="${'INV-' + (inv.id != null ? inv.id : 0)}">INV-1</td>
                                <td class="px-3 text-center text-nowrap-custom" th:text="${inv.createdDate != null ? #temporals.format(inv.createdDate, 'dd/MM/yyyy hh:mm a') : 'N/A'}">26/07/2026 02:30 PM</td>
                                <td class="px-3 text-nowrap-custom" th:text="${'BN-' + (inv.patientId != null ? inv.patientId : 0)}">BN-101</td>
                                <td class="px-3 fw-semibold text-nowrap-custom" th:text="${inv.patientName != null ? inv.patientName : 'Khách lẻ'}">Nguyễn Văn A</td>
                                <td class="px-3">
                                    <span class="d-inline-block" 
                                          th:utext="${inv.itemsSummary != null && !inv.itemsSummary.empty ? #strings.replace(inv.itemsSummary, ' | ', '<br/>') : 'Dịch vụ nha khoa'}">
                                           Khám răng
                                    </span>
                                </td>
                                <td class="px-3 text-end fw-bold text-success text-nowrap-custom" th:text="${#numbers.formatDecimal(inv.amount != null ? inv.amount : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                                <td class="px-3 text-center text-nowrap-custom">
                                    <span th:if="${inv.paymentStatus == 'PAID'}" class="badge bg-success">Đã thanh toán</span>
                                    <span th:if="${inv.paymentStatus != 'PAID'}" class="badge bg-warning text-dark">Chưa thanh toán</span>
                                </td>
                            </tr>

                            <tr th:if="${invoiceList == null or #lists.isEmpty(invoiceList)}">
                                <td colspan="7" class="text-center text-muted py-4">Chưa có dữ liệu hóa đơn nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-auto" th:replace="~{layout/footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
