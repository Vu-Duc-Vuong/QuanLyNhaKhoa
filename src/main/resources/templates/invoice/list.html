<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh Sách Hóa Đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{layout/sidebar}"></div>

    <div class="container mt-4 flex-grow-1">
        <h2 class="text-primary fw-bold mb-4">DANH SÁCH HÓA ĐƠN THANH TOÁN</h2>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center">Mã HĐ</th>
                            <th class="text-center">Ngày Lập</th>
                            <th class="text-center">Mã BN</th>
                            <th>Tên Bệnh Nhân</th>
                            <th>Chi Tiết Dịch Vụ / Thuốc</th>
                            <th class="text-end">Tổng Chi Phí</th>
                            <th class="text-center">Trạng Thái</th>
                            <th class="text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inv : ${invoiceList}">
                            <td class="text-center fw-bold" th:text="${'INV-' + inv.id}">INV-1</td>
                            <td class="text-center" th:text="${inv.createdDate}">2026-07-26</td>
                            <td class="text-center" th:text="${'BN-' + inv.patientId}">BN-1</td>
                            <td class="fw-bold" th:text="${inv.patientName}">Nguyễn Văn A</td>
                            <td>
                                <span class="badge bg-light text-dark border p-2" 
                                      th:text="${inv.itemsSummary != null ? inv.itemsSummary : 'Khám tổng quát'}">
                                    🛠️ Nhổ răng
                                </span>
                            </td>
                            <td class="text-end text-danger fw-bold" 
                                th:text="${#numbers.formatDecimal(inv.amount != null ? inv.amount : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                            <td class="text-center">
                                <span th:if="${inv.paymentStatus == 'PAID'}" class="badge bg-success">Đã Thanh Toán</span>
                                <span th:if="${inv.paymentStatus != 'PAID'}" class="badge bg-warning text-dark">Chưa Thanh Toán</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/invoice/checkout/{id}(id=${inv.id})}" class="btn btn-sm btn-primary fw-bold">
                                    👁️ Xem / Thanh Toán
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(invoiceList)}">
                            <td colspan="8" class="text-center py-4 text-muted">
                                Chưa có dữ liệu hóa đơn nào từ khám bệnh.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-auto" th:replace="~{layout/footer}"></div>

</body>
</html>
