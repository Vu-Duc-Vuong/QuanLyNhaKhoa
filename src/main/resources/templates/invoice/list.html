<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh Sách Hóa Đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .table-primary-custom th { background-color: #0d6efd !important; color: #ffffff !important; }
        .text-nowrap-custom { white-space: nowrap !important; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{layout/sidebar}"></div>

    <div class="container-fluid px-4 mt-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary fw-bold m-0">DANH SÁCH HÓA ĐƠN THANH TOÁN</h2>
            <button type="button" class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#addInvoiceModal">
                + Thêm Hóa Đơn Mới
            </button>
        </div>

        <div class="card shadow-sm border-0 content-card p-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0 w-100">
                        <thead class="table-primary-custom">
                            <tr>
                                <th class="text-center text-nowrap-custom" style="width: 100px;">Mã HĐ</th>
                                <th class="text-center text-nowrap-custom" style="width: 180px;">Ngày & Giờ Lập</th>
                                <th class="text-center text-nowrap-custom" style="width: 90px;">Mã BN</th>
                                <th class="text-nowrap-custom" style="width: 180px;">Tên Bệnh Nhân</th>
                                <th>Chi Tiết Dịch Vụ / Thuốc</th>
                                <th class="text-end text-nowrap-custom" style="width: 130px;">Tổng Chi Phí</th>
                                <th class="text-center text-nowrap-custom" style="width: 140px;">Trạng Thái</th>
                                <th class="text-center text-nowrap-custom" style="width: 160px;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inv : ${invoiceList}">
                                <td class="text-center fw-bold text-nowrap-custom" th:text="${'INV-' + inv.id}">INV-1</td>
                                <td class="text-center text-nowrap-custom" th:text="${inv.createdDate != null ? #temporals.format(inv.createdDate, 'dd/MM/yyyy hh:mm a') : 'N/A'}">26/07/2026 02:30 PM</td>
                                <td class="text-center text-nowrap-custom" th:text="${'BN-' + inv.patientId}">BN-1</td>
                                <td class="fw-bold text-nowrap-custom" th:text="${inv.patientName}">Nguyễn Văn A</td>
                                <td>
                                    <span class="d-inline-block" 
                                          th:utext="${inv.itemsSummary != null ? #strings.replace(inv.itemsSummary, ' | ', '<br/>') : 'Khám tổng quát'}">
                                        Nhổ răng
                                    </span>
                                </td>
                                <td class="text-end text-danger fw-bold text-nowrap-custom" 
                                    th:text="${#numbers.formatDecimal(inv.amount != null ? inv.amount : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                                <td class="text-center text-nowrap-custom">
                                    <span th:if="${inv.paymentStatus == 'PAID'}" class="badge bg-success">Đã Thanh Toán</span>
                                    <span th:if="${inv.paymentStatus != 'PAID'}" class="badge bg-warning text-dark">Chưa Thanh Toán</span>
                                </td>
                                <td class="text-center text-nowrap-custom">
                                    <a th:href="@{/invoice/checkout/{id}(id=${inv.id})}" class="btn btn-sm btn-primary fw-bold me-1">
                                        Xem / Thanh Toán
                                    </a>
                                    <a th:href="@{/invoice/delete/{id}(id=${inv.id})}" 
                                       onclick="return confirm('Xác nhận xóa hóa đơn này do ghi nhầm?');" 
                                       class="btn btn-sm btn-outline-danger fw-bold">
                                        Xóa
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(invoiceList)}">
                                <td colspan="8" class="text-center py-4 text-muted">
                                    Chưa có dữ liệu hóa đơn nào từ khám bệnh.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addInvoiceModal" tabindex="-1" aria-labelledby="addInvoiceModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/invoice/add}" method="post">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title fw-bold" id="addInvoiceModalLabel">Thêm Hóa Đơn Mới</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã Bệnh Nhân (Patient ID)</label>
                            <input type="number" name="patientId" class="form-control" placeholder="Nhập Mã ID Bệnh nhân (VD: 1, 2...)" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Bệnh Nhân</label>
                            <input type="text" name="patientName" class="form-control" placeholder="Nhập tên bệnh nhân" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chi Tiết Dịch Vụ / Thuốc</label>
                            <input type="text" name="itemsSummary" class="form-control" placeholder="Nhập chi tiết dịch vụ hoặc thuốc" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tổng Chi Phí (VNĐ)</label>
                            <input type="number" name="amount" class="form-control" placeholder="Nhập số tiền" min="0" step="1000" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="submit" class="btn btn-success fw-bold">Lưu Hóa Đơn</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-auto" th:replace="~{layout/footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
