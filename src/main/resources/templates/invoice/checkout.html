<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thanh toán hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .invoice-card {
            max-width: 650px;
            margin: 30px auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .invoice-header {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .qr-code-img {
            max-width: 250px;
            border: 2px solid #0d6efd;
            border-radius: 8px;
            padding: 5px;
        }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{layout/sidebar}"></div>

    <div class="container my-auto">
        <div class="card invoice-card border-0">
            <div class="invoice-header">
                <h3 class="fw-bold mb-0">HÓA ĐƠN THANH TOÁN DỊCH VỤ</h3>
            </div>

            <div class="card-body p-4">
                <div class="d-flex justify-content-between text-muted mb-3 border-bottom pb-2">
                    <div>
                        Mã bệnh nhân: <strong class="text-dark" th:text="${'BN-' + (invoice != null ? invoice.patientId : '')}">BN-0</strong>
                    </div>
                    <div>
                        Ngày lập: <strong class="text-dark" th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">2026-07-26</strong>
                    </div>
                </div>

                <div class="mb-3">
                    Mã hóa đơn: <strong class="text-primary" th:text="${'INV-' + (invoice != null ? invoice.id : '')}">INV-0</strong>
                </div>

                <div class="mb-4">
                    <h5 class="fw-bold text-secondary">Thông Tin Bệnh Nhân:</h5>
                    <p class="fs-5 mb-0">Họ và tên: <strong class="text-dark" th:text="${invoice != null ? invoice.patientName : 'N/A'}">Nguyễn Văn A</strong></p>
                </div>

                <div class="alert alert-info d-flex justify-content-between align-items-center p-3 my-4">
                    <span class="fs-5 fw-bold text-dark">Tổng chi phí thanh toán:</span>
                    <span class="fs-4 fw-bold text-danger" 
                          th:text="${#numbers.formatDecimal(invoice != null ? invoice.amount : 0, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                        0 VNĐ
                    </span>
                </div>

                <!-- 1. HIỂN THỊ NẾU ĐÃ THANH TOÁN -->
                <div th:if="${invoice != null && invoice.paymentStatus == 'PAID'}" class="alert alert-success text-center py-3 my-4 fw-bold fs-5">
                    Hóa đơn này đã được thanh toán thành công
                </div>

                <!-- 2. HIỂN THỊ MÃ QR NẾU CHƯA THANH TOÁN -->
                <div th:if="${invoice == null || invoice.paymentStatus != 'PAID'}" class="text-center my-4">
                    <p class="fw-bold text-muted mb-2">Quét mã QR để chuyển khoản:</p>
                    <img th:src="@{'https://api.vietqr.io/image/970422-0987654321-compact2.jpg?amount=' + ${#numbers.formatDecimal(invoice != null ? invoice.amount : 0, 0, 0)} + '&addInfo=Thanh%20toan%20hoa%20don%20INV-' + ${invoice != null ? invoice.id : 0}}"
                         alt="Mã QR Thanh Toán VietQR" 
                         class="qr-code-img img-fluid shadow-sm">
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-between mt-4">
                    <a th:href="@{/invoice}" class="btn btn-outline-secondary fw-bold px-4 d-flex align-items-center justify-content-center">
                        Quay lại
                    </a>
                    
                    <div class="d-flex gap-2">
                        <!-- NÚT XÓA HÓA ĐƠN NẾU ADMIN GHI NHẦM -->
                        <a th:if="${invoice != null}" 
                           th:href="@{/invoice/delete/{id}(id=${invoice.id})}" 
                           onclick="return confirm('Xác nhận xóa hóa đơn này do ghi nhầm?');" 
                           class="btn btn-outline-danger fw-bold px-3 d-flex align-items-center">
                            Xóa Hóa Đơn (Ghi Nhầm)
                        </a>

                        <!-- CHỈ HIỂN THỊ NÚT XÁC NHẬN KHI CHƯA THANH TOÁN -->
                        <form th:if="${invoice == null || invoice.paymentStatus != 'PAID'}" 
                              th:action="@{/invoice/pay/{id}(id=${invoice != null ? invoice.id : 0})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-success fw-bold px-4 fs-5 shadow">
                                Xác Nhận Đã Thanh Toán
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="mt-auto" th:replace="~{layout/footer}"></div>

</body>
</html>
