<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm bệnh nhân</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Thêm bệnh nhân</h2>

    <!-- Hiển thị lỗi -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Lỗi!</strong>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/patient/save}" th:object="${patient}" method="post">

        <div class="mb-3">
            <label>Mã bệnh nhân</label>
            <input type="text"
                   th:field="*{patientCode}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Họ tên</label>
            <input type="text"
                   th:field="*{fullName}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Ngày sinh</label>

            <input type="date"
                   th:field="*{dateOfBirth}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Giới tính</label>

            <select th:field="*{gender}" class="form-control">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Số điện thoại</label>

            <input type="text"
                   th:field="*{phone}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Địa chỉ</label>

            <input type="text"
                   th:field="*{address}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>CCCD</label>

            <input type="text"
                   th:field="*{cccd}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Tiền sử bệnh</label>

            <textarea th:field="*{medicalHistory}"
                      class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Dị ứng</label>

            <textarea th:field="*{allergy}"
                      class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Lý do khám</label>

            <textarea th:field="*{reason}"
                      class="form-control"></textarea>
        </div>

        <button class="btn btn-success">
            Lưu
        </button>

        <a href="/patient"
           class="btn btn-secondary">
            Quay lại
        </a>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
