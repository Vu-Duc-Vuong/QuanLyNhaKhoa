<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Thêm bệnh nhân</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<!-- Menu -->
<div th:replace="~{layout/sidebar}"></div>

<div class="container mt-4 flex-grow-1">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                Thêm bệnh nhân
            </h4>

        </div>

        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">

                <strong>Lỗi!</strong>

                <span th:text="${error}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

            <form th:action="@{/patient/save}"
                  th:object="${patient}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Mã bệnh nhân <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           th:field="*{patientCode}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Họ tên <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           th:field="*{fullName}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Ngày sinh <span class="text-danger">*</span>
                    </label>

                    <input type="date"
                           th:field="*{dateOfBirth}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Giới tính
                    </label>

                    <select th:field="*{gender}"
                            class="form-select">

                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Số điện thoại <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           th:field="*{phone}"
                           class="form-control"
                           maxlength="10"
                           pattern="[0-9]{10}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Địa chỉ
                    </label>

                    <input type="text"
                           th:field="*{address}"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        CCCD
                    </label>

                    <input type="text"
                           th:field="*{cccd}"
                           class="form-control"
                           maxlength="12"
                           pattern="[0-9]{12}">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Tiền sử bệnh
                    </label>

                    <textarea th:field="*{medicalHistory}"
                              class="form-control"
                              rows="3"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Dị ứng
                    </label>

                    <textarea th:field="*{allergy}"
                              class="form-control"
                              rows="3"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Lý do khám
                    </label>

                    <textarea th:field="*{reason}"
                              class="form-control"
                              rows="3"></textarea>

                </div>

                <button class="btn btn-success">

                    Lưu

                </button>

                <a href="/patient"
                   class="btn btn-secondary">

                    Quay lại

                </a>

            </form>

        </div>

    </div>

</div>

<div class="mt-auto"
     th:replace="~{layout/footer}">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
