<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Khám bệnh - Danh sách chờ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body class="d-flex flex-column min-vh-100 bg-light">


<!-- Navbar -->
<div th:replace="~{layout/sidebar}"></div>



<!-- Nội dung -->

<div class="container mt-4 flex-grow-1">


    <div class="card shadow-sm border-0 content-card p-4">



        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">


            <h2 class="text-primary fw-bold mb-0">

                Danh sách bệnh nhân chờ khám

            </h2>



            <!-- Tìm kiếm -->

            <form th:action="@{/treatment/search}"
                  method="get"
                  class="d-flex gap-2">


                <input type="text"
                       name="keyword"
                       class="form-control"
                       style="width:320px;"
                       placeholder="Tìm hồ sơ khám theo mã hoặc tên bệnh nhân">



                <button class="btn btn-success">

                    Tìm kiếm

                </button>


            </form>


        </div>





        <!-- Thông báo -->

        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show">

            <span th:text="${success}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>






        <!-- Bảng danh sách -->

        <div class="table-responsive">


            <table class="table table-bordered table-hover table-custom mb-0">


                <thead class="table-dark">

                <tr>

                    <th>Mã lịch hẹn</th>

                    <th>Bệnh nhân</th>

                    <th>SĐT</th>

                    <th>Ngày hẹn</th>

                    <th>Giờ hẹn</th>

                    <th>Ghi chú lịch hẹn</th>

                    <th>Chức năng</th>

                </tr>

                </thead>




                <tbody>


                <tr th:each="a : ${appointments}">


                    <td th:text="${a.appointmentCode}">
                        LH-001
                    </td>




                    <td th:text="${a.patient != null ? a.patient.fullName : 'Chưa có'}">
                        Nguyễn Văn A
                    </td>




                    <td th:text="${a.patient != null ? a.patient.phone : ''}">
                        0123456789
                    </td>




                    <td th:text="${a.appointmentDate}">
                        2026-07-26
                    </td>




                    <td th:text="${a.appointmentTime}">
                        08:00
                    </td>




                    <td th:text="${a.note}">
                        Không có
                    </td>




                    <td>


                        <a th:href="@{/treatment/exam/{id}(id=${a.id})}"
                           class="btn btn-primary btn-sm">

                            Vào khám

                        </a>


                    </td>



                </tr>





                <tr th:if="${#lists.isEmpty(appointments)}">


                    <td colspan="7"
                        class="text-center text-muted py-4">

                        Hiện không có bệnh nhân nào đang chờ khám

                    </td>


                </tr>




                </tbody>


            </table>


        </div>


    </div>


</div>





<!-- Footer -->

<div class="mt-auto"
     th:replace="~{layout/footer}">
</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
