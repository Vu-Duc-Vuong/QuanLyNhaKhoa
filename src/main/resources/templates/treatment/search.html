<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Hồ sơ khám</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="d-flex flex-column min-vh-100">


    <!-- Navbar -->
    <div th:replace="~{layout/sidebar}"></div>


    <!-- Nội dung -->
    <div class="container mt-4 flex-grow-1">


        <!-- Hai nút chuyển -->
        <div class="mb-3">

            <a href="/treatment" class="btn btn-outline-primary">
                Danh sách chờ khám
            </a>

            <a href="/treatment/history" class="btn btn-primary">
                Hồ sơ khám
            </a>

        </div>



        <!-- Tiêu đề -->
        <h2 class="mb-4">

            <span th:if="${keyword != null}">
                Kết quả tìm kiếm hồ sơ khám:
                "<span th:text="${keyword}"></span>"
            </span>


            <span th:if="${keyword == null}">
                Danh sách hồ sơ khám
            </span>

        </h2>




        <!-- Bảng -->
        <table class="table table-bordered table-hover">


            <thead class="table-dark">

                <tr>

                    <th>Mã hồ sơ khám</th>

                    <th>Bệnh nhân</th>

                    <th>Chẩn đoán</th>

                    <th>Trạng thái</th>

                    <th>Tổng tiền</th>

                    <th>Ngày tạo</th>

                    <th>Chức năng</th>

                </tr>

            </thead>



            <tbody>


                <tr th:each="t : ${treatments}">


                    <td th:text="${t.treatmentCode}">
                    </td>



                    <td th:text="${t.appointment != null && t.appointment.patient != null 
                        ? t.appointment.patient.fullName 
                        : 'Không có thông tin'}">
                    </td>



                    <td th:text="${t.diagnosis}">
                    </td>



                    <td>

                        <span class="badge bg-info"
                              th:text="${t.status}">
                        </span>

                    </td>



                    <!-- Format tiền -->
                    <td th:text="${#numbers.formatDecimal(t.totalAmount,0,'COMMA',0,'POINT')} + ' đ'">
                    </td>



                    <td th:text="${t.createdDate}">
                    </td>



                    <td>


                        <!-- Xem hồ sơ -->

                        <a th:if="${t.appointment != null}"
                           th:href="@{/treatment/exam/{id}(id=${t.appointment.id})}"
                           class="btn btn-primary btn-sm">

                            Xem

                        </a>



                        <!-- Xóa hồ sơ -->

                        <a th:if="${t.id != null}"
                           th:href="@{/treatment/delete/{id}(id=${t.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn xóa hồ sơ khám này?')">

                            Xóa

                        </a>


                    </td>


                </tr>




                <!-- Không có dữ liệu -->

                <tr th:if="${#lists.isEmpty(treatments)}">


                    <td colspan="7"
                        class="text-center text-muted">

                        Không có hồ sơ khám

                    </td>


                </tr>



            </tbody>


        </table>


    </div>





    <!-- Footer -->

    <div class="mt-auto"
         th:replace="~{layout/footer}">
    </div>



</body>


</html>
